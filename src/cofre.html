<!doctype html>
<html lang="pt-BR" data-tema="__TEMA__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="cofre-token" content="__TOKEN__">
  <meta name="cofre-desktop" content="__DESKTOP__">
  <meta name="cofre-tema" content="__TEMA__">
  <title>Cofre NF-e · Nunes</title>
  <link rel="icon" href="/icons/icone.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icone-192.png">
  <link rel="stylesheet" href="/cofre.css">
  <script src="/nunes-tema.js"></script>
  <script src="/cofre.js" defer></script>
</head>
<body>
<main>
  <header class="cabecalho">
    <div class="marca"><img src="/icons/icone.svg" width="32" height="32" alt=""><h1>Cofre NF-e <span>· Nunes</span></h1></div>
    <div class="controles-cabecalho">
    <button id="tema" class="botao-icone" type="button" title="Alternar tema" aria-label="Ativar tema escuro">Tema escuro</button>
    <details class="configuracoes" id="configuracoes"><summary class="botao-icone" title="Configurações" aria-label="Configurações"><svg class="icone-controle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></summary><div class="menu-configuracoes">
      <div class="configuracao-caminho configuracao-documentos">
        <label for="pasta-base" class="dica">Selecione a própria pasta DOCUMENTOS DE ENTRADA.</label>
        <input id="pasta-base" class="base-destino" type="text" value="__DESTINO_BASE__" spellcheck="false" readonly>
        <div class="acoes-pasta"><button id="escolher-pasta" type="button" aria-label="Alterar pasta de documentos" disabled>Alterar</button><button id="abrir-pasta" type="button" aria-label="Abrir pasta de documentos" disabled>Abrir</button></div>
      </div>
      <div class="configuracao-caminho">
        <label for="arquivo-emitentes" class="dica">Arquivo de emitentes conhecidos</label>
        <input id="arquivo-emitentes" class="base-destino" type="text" value="__ARQUIVO_EMITENTES__" spellcheck="false" readonly>
        <div class="acoes-pasta"><button id="escolher-emitentes" type="button" aria-label="Alterar arquivo de emitentes" disabled>Alterar</button><button id="abrir-emitentes" type="button" aria-label="Abrir pasta dos emitentes" disabled>Abrir</button><button id="editar-emitentes" type="button" aria-label="Editar emitentes no Bloco de Notas" disabled>Editar</button></div>
      </div>
      <p id="configuracao-status" class="dica" role="status"></p>
    </div></details>
    </div>
  </header>
  <section class="area-trabalho" aria-label="Documentos">
    <form id="formulario"><fieldset id="campos">
      <div class="parametros">
        <fieldset id="tipo"><legend>Tipo</legend><div class="segmentado"><label><input type="radio" name="tipo" value="nfe" checked>NF-e</label><label><input type="radio" name="tipo" value="cte">CT-e</label></div></fieldset>
        <fieldset id="empresa"><legend>Empresa</legend><div class="segmentado"><label><input type="radio" name="empresa" value="FILIAL" checked>Filial</label><label><input type="radio" name="empresa" value="MATRIZ">Matriz</label></div></fieldset>
        <div class="competencias">
          <label>Competência<input id="competencia" type="month" value="__MES__" min="0001-01" max="9999-12" required></label>
          <label id="campo-pasta">Pasta<input id="pasta" type="month" value="__MES__" min="0001-01" max="9999-12" disabled></label>
          <label class="opcao" for="mesma-pasta"><input id="mesma-pasta" type="checkbox" checked><span>Pasta na mesma competência</span></label>
        </div>
      </div>
      <div class="documentos">
        <div class="cabecalho-entrada">
          <p id="rotulo-notas" class="rotulo-campo">Notas</p>
          <p id="dica-notas" class="dica">Separe por vírgula ou linha.</p>
          <p id="mensagem" class="mensagem" role="alert"></p>
        </div>
        <textarea id="notas" autofocus rows="2" inputmode="numeric" spellcheck="false" maxlength="12000" placeholder="12345, 12346, 12347" aria-labelledby="rotulo-notas" aria-describedby="dica-notas"></textarea>
        <div class="rodape-entrada">
          <label class="opcao atalho-notas" title="Quando marcado, Enter baixa e Shift+Enter quebra a linha."><input id="enter-baixar" type="checkbox" __ENTER_BAIXAR__><span>Enter para baixar</span></label>
          <div class="acoes acoes-notas"><button type="submit" id="iniciar" class="botao-principal" disabled>Baixar</button><button type="button" id="limpar-notas" disabled>Limpar</button></div>
        </div>
      </div>
    </fieldset></form>
    <section class="resultados" aria-labelledby="titulo-resultados">
      <div class="titulo-secao"><h2 id="titulo-resultados">Resultados</h2></div>
      <div class="rolagem-resultados" tabindex="0" role="region" aria-label="Andamento e resultados por nota">
      <div class="andamento" aria-label="Andamento"><span id="fase" class="sr-only">Aguardando</span><p id="status" role="status">Pronto</p><button id="parar" type="button" hidden>Parar processamento</button></div>
      <div id="resumo" class="contagens" aria-label="Resumo do lote" hidden><span class="indicador concluidos"><strong id="concluidos">0</strong>Concluídas</span><span class="indicador pendentes"><strong id="pendentes">0</strong>Pendentes</span><span class="indicador erros" title="Erros e notas que precisam de conferência"><strong id="erros">0</strong>Erros</span></div>
      <p id="lote" class="dica lote" hidden></p>
      <progress id="progresso" class="sr-only" value="0" max="1" aria-label="Progresso do lote"></progress>
      <p id="conexao" class="conexao" role="alert" hidden></p>
      <section id="decisao" class="aviso" aria-labelledby="titulo-decisao" hidden>
        <h3 id="titulo-decisao" tabindex="-1">Confira o emitente</h3><p id="ajuda-decisao"></p>
        <form id="form-decisao"><div id="opcoes"></div><div id="campo-nome" hidden><label for="nome">Apelido</label><input id="nome" type="text" maxlength="120" autocomplete="off"></div><div class="acoes"><button id="responder" class="botao-principal" type="submit">Confirmar</button><button id="cancelar-decisao" type="button">Parar execução</button></div></form>
        <p id="erro-decisao" class="mensagem" role="alert"></p>
      </section>
      <ul id="linhas" class="lista-resultados" aria-label="Resultado por nota"><li class="vazio">O resultado das notas aparecerá aqui.</li></ul>
      </div>
    </section>
  </section>
</main>
<footer class="rodape"><p class="assinatura">Desenvolvido por <a href="https://github.com/Gabriel2Mello" target="_blank" rel="noopener noreferrer" aria-label="g2mello — perfil no GitHub"><span aria-hidden="true">g2me<span class="assinatura-ll"><span>l</span><span>l</span></span>o</span></a></p><button id="encerrar" type="button">Encerrar</button></footer>
</body>
</html>
